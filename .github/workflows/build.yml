name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show uploaded files
        run: ls -la

      - name: Unzip project
        run: |
          for z in *.zip; do
            [ -f "$z" ] && echo "Unzipping $z" && unzip -o -q "$z"
          done
          F=$(find . -name settings.gradle -not -path "./.git/*" | head -1)
          if [ -z "$F" ]; then
            echo "ERROR: settings.gradle not found. Upload DendroBloom.zip to the repository."
            exit 1
          fi
          PROJ=$(dirname "$F")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project folder: $PROJ"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: cd "$PROJ" && gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DendroBloom-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
